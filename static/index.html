<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickle Order</title>
    <style>
        body { font-family: sans-serif; background: #f7fafc; margin: 0; padding: 2rem; }
        .container { max-width: 400px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2rem; }
        h1 { text-align: center; color: #2d3748; }
        label { display: block; margin-top: 1rem; color: #4a5568; }
        input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e0; border-radius: 4px; }
        button { margin-top: 1.5rem; width: 100%; padding: 0.75rem; background: #38a169; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #2f855a; }
        .msg { margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Order Pickles</h1>
        <form id="orderForm">
            <label for="product">Product</label>
            <select id="product" name="product">
                <option value="classic">Spicy Pickle</option>
                <option value="spicy">Sweet Pickle</option>
            </select>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>
            <label for="contact">Contact Info</label>
            <input type="text" id="contact" name="contact" required>
            <button type="submit">Submit Order</button>
        </form>
        <div class="msg" id="msg"></div>
    </div>
    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = '';
            const data = {
                product: document.getElementById('product').value,
                quantity: document.getElementById('quantity').value,
                name: document.getElementById('name').value,
                contact: document.getElementById('contact').value
            };
            try {
                const res = await fetch('/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    msg.textContent = 'Order submitted!';
                    msg.style.color = '#38a169';
                    document.getElementById('orderForm').reset();
                } else {
                    const err = await res.json();
                    msg.textContent = err.detail || 'Error submitting order.';
                    msg.style.color = '#e53e3e';
                }
            } catch {
                msg.textContent = 'Network error.';
                msg.style.color = '#e53e3e';
            }
        });
    </script>
</body>
</html>
