<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurken bestellen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-lime-50 text-stone-900">
  <main class="min-h-screen flex items-center justify-center p-6">
    <section class="grid w-full max-w-5xl overflow-hidden rounded-3xl border border-lime-200 bg-white shadow-[0_20px_80px_rgba(0,0,0,0.08)] md:grid-cols-2">

      <div class="bg-gradient-to-br from-lime-200 via-lime-100 to-emerald-50 p-8 md:p-12">
        <span class="inline-flex rounded-full bg-stone-900 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-lime-100">
          Pfalzauer Prime Pickles
        </span>
        <h1 class="mt-6 text-4xl font-black tracking-tight text-stone-900 md:text-5xl">
          Gurken bestellen
          <span class="block text-emerald-700">mit Geschmack.</span>
        </h1>
        <p class="mt-4 max-w-md text-base leading-7 text-stone-700">
          Würzig. Knackig. Zum Finger lecken. Wähl' dein Glas und lass' dir schmecken!
        </p>
        <div class="mt-8 space-y-3 text-sm text-stone-700">
          <div class="flex items-center gap-3">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-600"></span>
            1 Glas = 500ml Geschmack
          </div>
          <div class="flex items-center gap-3">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-600"></span>
            Kleine Chargen, großes Umami!
          </div>
          <div class="flex items-center gap-3">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-600"></span>
            Mit leckeren, regionalen Zutaten.
          </div>
        </div>
      </div>

      <div class="p-8 md:p-12">
        <form id="orderForm" class="space-y-5" method="post" action="/api/orders/add">
          <div>
            <label for="product_id" class="mb-2 block text-sm font-medium text-stone-700">Produkt</label>
            <select id="product_id" name="product_id" class="w-full rounded-2xl border border-stone-300 bg-white px-4 py-3 outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100">
              <option value="1">Gurke, würzig</option>
              <option value="2">Gurke, klassisch</option>
            </select>
          </div>
          <div>
            <label for="quantity" class="mb-2 block text-sm font-medium text-stone-700">Menge</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required class="w-full rounded-2xl border border-stone-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" />
          </div>
          <div>
            <label for="customer_name" class="mb-2 block text-sm font-medium text-stone-700">Dein Name</label>
            <input type="text" id="customer_name" name="customer_name" required class="w-full rounded-2xl border border-stone-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" />
          </div>
          <div>
            <label for="customer_email" class="mb-2 block text-sm font-medium text-stone-700">Kontakt</label>
            <input type="text" id="customer_email" name="customer_email" required class="w-full rounded-2xl border border-stone-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" />
          </div>
          <button type="submit" class="w-full rounded-2xl bg-emerald-600 px-5 py-3.5 text-sm font-semibold text-white transition hover:bg-emerald-700">
            Glas abschicken
          </button>
        </form>
        <!-- Success/error messages will be handled by the backend and shown as a new page -->
      </div>
    </section>
  </main>
    <!-- No JavaScript needed for plain HTML form submission -->
</body>
</html>
