<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestellung erfolgreich – Pfalzauer Prime Pickles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen text-stone-900 bg-cover bg-center"
  style="background-image:
    linear-gradient(rgba(80,70,40,0.38), rgba(80,70,40,0.44), rgba(247,242,232,0.92)),
    url('https://pplx-res.cloudinary.com/image/upload/pplx_search_images/41cc34f14c97fdd2af9ffa61314a154308535fd6.jpg');"
>
  <header class="border-b border-stone-300 bg-stone-50">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.24em] text-emerald-800">
          Pfalzauer Prime Pickles
        </p>
        <p class="mt-1 text-sm text-stone-600">
          Hofladen · Kleine Chargen · Eingelegt mit Haltung
        </p>
      </div>
      <div class="hidden text-sm text-stone-600 md:block">
        Bestellung für Abholung oder Lieferung
      </div>
    </div>
  </header>

  <main class="px-6 py-8 md:py-12">
    <section class="mx-auto max-w-2xl rounded-[2rem] border border-stone-300 bg-stone-50 shadow-[0_20px_60px_rgba(60,40,20,0.10)] p-8 md:p-12 text-center">
      <div class="flex flex-col items-center">
        <svg class="mb-6 h-16 w-16 text-emerald-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="#e6f4ea"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 12l2.5 2.5L16 9" stroke="#059669" stroke-width="2"/></svg>
        <h1 class="text-3xl font-black tracking-tight text-stone-900 md:text-4xl mb-4">Bestellung eingegangen!</h1>
        <p class="text-lg text-stone-700 mb-6">Vielen Dank für deine Bestellung.<br>Wir bereiten dein Glas vor und melden uns bei dir für die Abholung oder Lieferung.</p>
        <a href="/" class="inline-block rounded-2xl bg-emerald-700 px-6 py-3 text-sm font-bold uppercase tracking-[0.14em] text-stone-50 transition hover:bg-emerald-800">Zurück zur Startseite</a>
      </div>
    </section>
  </main>
</body>
</html>
