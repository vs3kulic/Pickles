<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Add to Stock</title>
    <link rel="stylesheet" href="static/main.css">
</head>
<body>
    <h1>Add Product to Stock</h1>
    <form id="add-product-form" method="post" action="/api/inventory">
        <label>
            Product ID:
            <input type="number" name="product_id" required>
        </label><br>
        <label>
            Product Key:
            <input type="text" name="product_key" required>
        </label><br>
        <label>
            Quantity:
            <input type="number" name="product_quantity" min="0" required>
        </label><br>
        <button type="submit">Add to Stock</button>
    </form>
</body>
</html>
