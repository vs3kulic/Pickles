<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Add to Stock</title>
    <link rel="stylesheet" href="static/main.css">
</head>
<body>
    <h1>Inventory Stock Management</h1>

    <h2>Add to Stock</h2>
    <form action="/api/inventory/add" method="post">
        <label>
            Product ID:
            <input type="number" name="product_id" required>
        </label><br>
        <label>
            Product Key:
            <input type="text" name="product_key" required>
        </label><br>
        <label>
            Quantity:
            <input type="number" name="quantity" min="1" required>
        </label><br>
        <button type="submit">Add to Stock</button>
    </form>

    <h2>Reduce Stock</h2>
    <form action="/api/inventory/reduce" method="post">
        <label>
            Product ID:
            <input type="number" name="product_id" required>
        </label><br>
        <label>
            Quantity to Reduce:
            <input type="number" name="quantity" min="1" required>
        </label><br>
        <button type="submit">Reduce Stock</button>
    </form>

</body>
</html>
